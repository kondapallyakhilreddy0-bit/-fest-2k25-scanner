<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEST 2K25 ENTRY SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>🎟️ FEST 2K25 ENTRY SCANNER</h1>

<div id="reader"></div>

<div id="result">📷 Scan QR</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbypJ4FqT8xtThzpohlhwwPF8Om_LHH7ZNBFwYYHjRbJkS6jdX2TBqKUX_0BJ0IdSBqG/exec";

let scanning = true;

function showResult(message) {
  document.getElementById("result").innerHTML = message;
}

function checkPass(passId) {

  showResult("🔍 Checking...");

  const callbackName =
    "qrCallback_" + Date.now();

  window[callbackName] = function(result) {

    delete window[callbackName];

    if (result.success) {

      showResult(
        "✅ ENTRY ALLOWED<br><br>" +
        "Pass ID: " + result.passId +
        "<br>Name: " + result.name
      );

    } else {

      showResult(
        "❌ " + result.message +
        (result.passId ? "<br><br>Pass ID: " + result.passId : "")
      );
    }

    setTimeout(() => {
      showResult("📷 Scan next QR");
      scanning = true;
    }, 4000);
  };

  const script = document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?action=checkPass" +
    "&passId=" +
    encodeURIComponent(passId) +
    "&callback=" +
    callbackName;

  script.onerror = function() {

    delete window[callbackName];

    showResult("❌ CONNECTION ERROR");

    setTimeout(() => {
      showResult("📷 Scan next QR");
      scanning = true;
    }, 4000);
  };

  document.body.appendChild(script);
}


function onScanSuccess(decodedText) {

  if (!scanning) return;

  scanning = false;

  const passId = decodedText.trim();

  checkPass(passId);
}


function onScanFailure(error) {
  // Ignore normal scanning failures
}


const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 15,
    qrbox: {
      width: 300,
      height: 300
    },
    rememberLastUsedCamera: true
  },
  false
);

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
