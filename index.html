<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEST 2K25 ENTRY SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #111;
      color: white;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: auto;
    }

    #result {
      margin-top: 20px;
      padding: 20px;
      font-size: 22px;
      font-weight: bold;
      border-radius: 10px;
    }
  </style>
</head>

<body>

<h1>🎟️ FEST 2K25 ENTRY SCANNER</h1>

<div id="reader"></div>

<div id="result">📷 Scan QR</div>

<script>

const SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbypJ4FqT8xtThzpohlhwwPF8Om_LHH7ZNBFwYYHjRbJkS6jdX2TBqKUX_0BJ0IdSBqG/exec";

let scanning = true;
let checkFrame = null;
let checkTimeout = null;


function showResult(message) {
  document.getElementById("result").innerHTML = message;
}


/* RECEIVE RESULT FROM APPS SCRIPT */
window.addEventListener("message", function(event) {

  if (!event.data || event.data.type !== "QR_RESULT") {
    return;
  }

  if (checkTimeout) {
    clearTimeout(checkTimeout);
    checkTimeout = null;
  }

  if (checkFrame) {
    checkFrame.remove();
    checkFrame = null;
  }

  const result = event.data.result;

  if (result.success) {

    showResult(
      "✅ ENTRY ALLOWED<br><br>" +
      "Pass ID: " + result.passId +
      "<br>Name: " + result.name
    );

  } else {

    showResult(
      "❌ " + result.message +
      (result.passId
        ? "<br><br>Pass ID: " + result.passId
        : "")
    );
  }

  setTimeout(function() {
    showResult("📷 Scan next QR");
    scanning = true;
  }, 4000);

});


/* CHECK QR WITH APPS SCRIPT */
function checkPass(passId) {

  showResult("🔍 Checking...");

  scanning = false;

  if (checkFrame) {
    checkFrame.remove();
  }

  const iframe = document.createElement("iframe");

  iframe.style.display = "none";

  document.body.appendChild(iframe);

  checkFrame = iframe;

  const encodedPassId =
    encodeURIComponent(passId);

  iframe.srcdoc = `
<!DOCTYPE html>
<html>
<body>

<script>

window.callback = function(result) {

  parent.postMessage(
    {
      type: "QR_RESULT",
      result: result
    },
    "*"
  );

};

const script = document.createElement("script");

script.src =
"${SCRIPT_URL}?action=checkPass&passId=${encodedPassId}&callback=callback";

document.body.appendChild(script);

<\/script>

</body>
</html>
`;

  /* CONNECTION TIMEOUT */

  checkTimeout = setTimeout(function() {

    if (checkFrame) {
      checkFrame.remove();
      checkFrame = null;
    }

    showResult("❌ CONNECTION ERROR");

    setTimeout(function() {
      showResult("📷 Scan next QR");
      scanning = true;
    }, 4000);

  }, 10000);
}


/* WHEN QR IS SCANNED */
function onScanSuccess(decodedText) {

  if (!scanning) {
    return;
  }

  scanning = false;

  const passId = decodedText.trim();

  checkPass(passId);
}


/* IGNORE SCAN ERRORS */
function onScanFailure(error) {
}


/* START CAMERA */

const scanner = new Html5QrcodeScanner(
  "reader",
  {
    fps: 15,
    qrbox: {
      width: 300,
      height: 300
    },
    rememberLastUsedCamera: true
  },
  false
);

scanner.render(
  onScanSuccess,
  onScanFailure
);

</script>

</body>
</html>
