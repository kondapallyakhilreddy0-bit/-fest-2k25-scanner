
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FEST 2K25 ENTRY SCANNER</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      margin: 5px;
    }

    h2 {
      margin: 5px 0 20px;
    }

    #reader {
      width: 100%;
      max-width: 450px;
      margin: auto;
      background: white;
    }

    #result {
      max-width: 450px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 15px;
      background: white;
      font-size: 20px;
    }

    .allowed {
      background: #d9fdd3 !important;
      color: #087f23;
    }

    .denied {
      background: #ffd6d6 !important;
      color: #b00020;
    }

    .name {
      font-size: 24px;
      font-weight: bold;
      margin: 10px 0;
    }

    .pass {
      font-size: 18px;
      margin-top: 8px;
    }
  </style>
</head>

<body>

<h1>FEST 2K25</h1>
<h2>ENTRY SCANNER</h2>

<div id="reader"></div>

<div id="result">
  📷 Starting camera...
</div>

<script>

const SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbypJ4FqT8xtThzpohlhwwPF8Om_LHH7ZNBFwYYHjRbJkS6jdX2TBqKUX_0BJ0IdSBqG/exec";

let scanner;
let processing = false;


function startScanner() {

  scanner = new Html5Qrcode("reader");

  scanner.start(
    { facingMode: "environment" },
    {
      fps: 10,
      qrbox: 250
    },

    function(decodedText) {

      if (processing) return;

      processing = true;

      document.getElementById("result").innerHTML =
        "🔍 Checking...";

      scanner.stop().then(function() {

        checkPass(decodedText);

      });

    },

    function(errorMessage) {
      // Ignore normal scanning errors
    }

  ).then(function() {

    document.getElementById("result").innerHTML =
      "📷 Point camera at QR";

  }).catch(function(error) {

    document.getElementById("result").innerHTML =
      "❌ CAMERA ERROR<br><br>" + error;

  });

}


function checkPass(passId) {

  const callbackName =
    "qrCallback_" + Date.now();

  window[callbackName] = function(result) {

    delete window[callbackName];

    showResult(result);

    setTimeout(function() {

      processing = false;

      document.getElementById("result").innerHTML =
        "📷 Ready for next QR";

      startScanner();

    }, 2500);

  };


  const script = document.createElement("script");

  script.src =
    SCRIPT_URL +
    "?action=checkPass" +
    "&passId=" +
    encodeURIComponent(passId) +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);

}


function showResult(result) {

  const box =
    document.getElementById("result");


  if (result.success) {

    box.className = "allowed";

    box.innerHTML =
      "<div>✅ ENTRY ALLOWED</div>" +
      "<div class='name'>" +
      result.name +
      "</div>" +
      "<div class='pass'>" +
      "Pass ID: " +
      result.passId +
      "</div>" +
      "<div>Payment: PAID</div>";

  } else {

    box.className = "denied";

    let html =
      "<div>❌ " +
      result.message +
      "</div>";

    if (result.name) {

      html +=
        "<div class='name'>" +
        result.name +
        "</div>";

    }

    if (result.passId) {

      html +=
        "<div class='pass'>" +
        "Pass ID: " +
        result.passId +
        "</div>";

    }

    box.innerHTML = html;

  }

}


startScanner();

</script>

</body>
</html>
